# Sobe o sistema completo: banco, API e interface web.
#   docker compose up --build        →  http://localhost:8080  (a API fica em http://localhost:8080/api)
# Os valores abaixo têm padrões para demonstração; para mudá-los, copie .env.example para .env.

name: portal-solicitacoes

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_demo_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executados automaticamente, em ordem alfabética, apenas na PRIMEIRA criação do volume.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # -h 127.0.0.1 força a conexão por TCP: sem host, o pg_isready usa o socket Unix, que o servidor TEMPORÁRIO de
      # inicialização da imagem oficial (enquanto roda schema.sql e seed.sql) também atende, e o banco poderia ser dado
      # como pronto antes de o servidor definitivo aceitar conexões de outros contêineres. Medido: não consegui reproduzir a
      # falha em 3 tentativas; é um endurecimento preventivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Para inspecionar o banco com um cliente SQL, descomente (ajuste a porta se 5432 estiver em uso):
    # ports: ["5432:5432"]

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:-portal_demo_password}@db:5432/portal
      # Troque em qualquer ambiente real. O padrão existe só para a demonstração funcionar sem configuração.
      JWT_SECRET: ${JWT_SECRET:-segredo-de-demonstracao-troque-em-producao}
      # Autoriza o segredo de DEMONSTRAÇÃO acima em NODE_ENV=production (sem isso a API recusa partir). Existe só para o
      # `docker compose up` funcionar sem configuração; a API mostra um aviso no log. AO PUBLICAR DE VERDADE: defina JWT_SECRET
      # próprio (openssl rand -hex 32), remova esta linha e use HTTPS com COOKIE_SECURE=true.
      PERMITIR_SEGREDOS_DE_DEMONSTRACAO: ${PERMITIR_SEGREDOS_DE_DEMONSTRACAO:-true}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true somente quando houver HTTPS
      TRUST_PROXY: "true"                       # há um nginx na frente
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    # A API NÃO é publicada no host: o único caminho até ela é o nginx (/api). Isso é proposital. Com TRUST_PROXY ligado,
    # a API confia no cabeçalho X-Forwarded-For; quem a acessasse direto poderia forjá-lo e burlar o limite de tentativas
    # de login. Se precisar chamá-la diretamente em desenvolvimento, publique só para a sua máquina e DESLIGUE o proxy:
    #   ports: ["127.0.0.1:3000:3000"]   e   TRUST_PROXY: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
