# Sobe o sistema completo: banco, API e interface web.
#   docker compose up --build        →  http://localhost:8080
# Os valores abaixo têm padrões para demonstração; para mudá-los, copie .env.example para .env.

name: portal-solicitacoes

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_demo_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executados automaticamente, em ordem alfabética, apenas na PRIMEIRA criação do volume.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Para inspecionar o banco com um cliente SQL, descomente (ajuste a porta se 5432 estiver em uso):
    # ports: ["5432:5432"]

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:-portal_demo_password}@db:5432/portal
      # Troque em qualquer ambiente real. O padrão existe só para a demonstração funcionar sem configuração.
      JWT_SECRET: ${JWT_SECRET:-segredo-de-demonstracao-troque-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true somente quando houver HTTPS
      TRUST_PROXY: "true"                       # há um nginx na frente
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
