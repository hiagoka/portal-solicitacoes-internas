server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: o prefixo /api é removido e a requisição segue ao backend.
    # Passamos o IP original para o rate limit do login enxergar cada cliente.
    #
    # O endereço do backend é uma VARIÁVEL e há um "resolver": assim o nginx consulta o DNS do Docker de novo de tempos
    # em tempos. Com `proxy_pass http://backend:3000/;` literal, o nginx resolve o nome UMA vez, na partida, e continua
    # enviando ao IP antigo depois que o contêiner da API é recriado (502 até reiniciar o nginx). Como uma variável em
    # proxy_pass desliga a troca automática do prefixo, o "rewrite" abaixo faz esse papel (e preserva a query string).
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;   # DNS embutido do Docker
        set $backend http://backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sem "include security-headers.conf" aqui: a própria API já envia os cabeçalhos de segurança (helmet). Repeti-los no
        # nginx duplicaria X-Frame-Options e Referrer-Policy com VALORES DIFERENTES (DENY e SAMEORIGIN), o que é ambíguo.
    }

    # Arquivos com hash no nome (gerados pelo Vite) nunca mudam: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA: qualquer outro caminho (ex.: /solicitacoes/4) devolve o index.html e o React Router decide a tela.
    # O index.html não pode ficar em cache, senão uma nova versão do app não chega ao usuário.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
