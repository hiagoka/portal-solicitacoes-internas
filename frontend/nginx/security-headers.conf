# Cabeçalhos de segurança básicos. Incluído em cada location que define add_header, porque o nginx
# NÃO herda add_header do nível superior quando o location define o seu próprio.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
